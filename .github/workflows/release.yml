name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the already-versioned main commit after full CI passes"
        type: boolean
        required: true
        default: false
      version:
        description: "Exact CLI version to publish (required when publish is true)"
        type: string
        required: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.16.1"

jobs:
  # Job 1: Create Version Packages PR when changesets exist
  version-pr:
    name: Create Version PR
    timeout-minutes: 15
    concurrency:
      group: version-pr-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.publish)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: check-changesets
        run: |
          CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l | tr -d ' ')
          echo "Found $CHANGESET_COUNT changeset(s)"
          echo "has_changesets=$([[ $CHANGESET_COUNT -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Create Version PR
        if: steps.check-changesets.outputs.has_changesets == 'true'
        uses: changesets/action@v1
        with:
          commit: "chore: release packages"
          title: "chore: release packages"
          version: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Publish an already-versioned main commit after exact-commit full CI.
  publish:
    name: Publish to npm
    timeout-minutes: 60
    concurrency:
      group: publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.title, 'chore: release packages')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Publish and tag the reviewed merge, even if main advances while queued.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify immutable release target and full CI
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          CI_WAIT_SECONDS: "2400"
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG_NAME="v${CLI_VERSION}"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Publishing is only allowed from main'; exit 1; }
            [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" == "$CLI_VERSION" ]] || { echo 'Requested version must match the already-versioned CLI package'; exit 1; }
          fi
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null; then
            git fetch origin "refs/tags/$TAG_NAME"
            [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$TARGET_SHA" ]] || { echo "Existing $TAG_NAME points to a different commit"; exit 1; }
          else
            TAG_STATUS=$?
            [[ "$TAG_STATUS" == 2 ]] || { echo 'Could not verify the remote release tag'; exit "$TAG_STATUS"; }
          fi
          RELEASE_SHA="$TARGET_SHA" node scripts/verify-release-ci.mjs
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish to npm
        run: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ensure tag for the published version
        id: create-tags
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TAG_NAME: ${{ steps.target.outputs.tag }}
          CLI_VERSION: ${{ steps.target.outputs.cli_version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null; then
            git fetch origin "refs/tags/$TAG_NAME"
            [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$TARGET_SHA" ]] || { echo "Existing $TAG_NAME points to a different commit"; exit 1; }
          else
            TAG_STATUS=$?
            [[ "$TAG_STATUS" == 2 ]] || { echo 'Could not verify the remote release tag'; exit "$TAG_STATUS"; }
            git tag "$TAG_NAME" "$TARGET_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from commits
        run: |
          set -euo pipefail

          mkdir -p dist

          CURRENT_TAG="${{ steps.create-tags.outputs.latest_tag }}"
          CLI_VERSION="${{ steps.create-tags.outputs.cli_version }}"
          PREV_TAG=$(git tag --merged HEAD --list 'v*' --sort=-v:refname | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)

          echo "# vellum v${CLI_VERSION}" > dist/release-notes.md
          echo "" >> dist/release-notes.md
          echo "## ✨ What's Changed" >> dist/release-notes.md
          echo "" >> dist/release-notes.md

          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$CURRENT_TAG"
          else
            RANGE="$CURRENT_TAG"
          fi

          FILTER_CMD="grep -Ev 'by (github-actions\[bot\]|dependabot\[bot\]|renovate\[bot\])$'"

          add_section() {
            local title="$1"
            local pattern="$2"
            local lines
            lines=$(git log "$RANGE" --no-merges --pretty=format:'- %s (%h) by %an' | eval "$FILTER_CMD" | grep -E "$pattern" || true)
            if [ -n "$lines" ]; then
              echo "## $title" >> dist/release-notes.md
              echo "" >> dist/release-notes.md
              echo "$lines" >> dist/release-notes.md
              echo "" >> dist/release-notes.md
              return 0
            fi
            return 1
          }

          add_section "Features" '^- (feat|feature)(\(.+\))?: ' || true
          add_section "Fixes" '^- (fix|bugfix)(\(.+\))?: ' || true
          add_section "Docs" '^- (docs)(\(.+\))?: ' || true
          add_section "Refactors" '^- (refactor)(\(.+\))?: ' || true
          add_section "Chores" '^- (chore|build|ci|deps)(\(.+\))?: ' || true
          add_section "Tests" '^- (test)(\(.+\))?: ' || true

          other_lines=$(git log "$RANGE" --no-merges --pretty=format:'- %s (%h) by %an' | eval "$FILTER_CMD" \
            | grep -Ev '^- (feat|feature|fix|bugfix|docs|refactor|chore|build|ci|deps|test)(\(.+\))?: ' || true)
          if [ -n "$other_lines" ]; then
            echo "## Other Changes" >> dist/release-notes.md
            echo "" >> dist/release-notes.md
            echo "$other_lines" >> dist/release-notes.md
            echo "" >> dist/release-notes.md
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "## Full Changelog" >> dist/release-notes.md
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}" >> dist/release-notes.md
          else
            echo "## Full Changelog" >> dist/release-notes.md
            echo "https://github.com/${GITHUB_REPOSITORY}/commits/${CURRENT_TAG}" >> dist/release-notes.md
          fi

      - name: Create zip archive
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          mkdir -p dist
          # Archive only the exact reviewed source tree, never runner-local files.
          git archive --format=zip --output=dist/vellum.zip "$TARGET_SHA"

      - name: Create or update GitHub Release and assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create-tags.outputs.latest_tag }}
          target_commitish: ${{ steps.target.outputs.sha }}
          generate_release_notes: false
          body_path: dist/release-notes.md
          draft: false
          prerelease: false
          make_latest: legacy
          files: dist/vellum.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
